name: Build Docker Image

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  packages: write
  contents: read

jobs:
  build:
    strategy:
      matrix:
        platform:
          - name: amd64
            runner: ubuntu-latest
            arch: linux/amd64
          - name: arm64
            runner: ubuntu-24.04-arm
            arch: linux/arm64
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push arch-specific image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform.arch }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ matrix.platform.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifest list for latest
        uses: docker/build-push-action@v6
        with:
          context: .
          target: manifest
          manifest: true
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          platforms: linux/amd64,linux/arm64
          manifest-list: |
            ghcr.io/${{ github.repository }}:amd64
            ghcr.io/${{ github.repository }}:arm64
