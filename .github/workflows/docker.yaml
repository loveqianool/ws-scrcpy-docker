name: Build Docker Image
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  packages: write
  contents: read

jobs:
  build:
    strategy:
      matrix:
        platform:
          - name: amd64
            runner: ubuntu-latest
            arch: linux/amd64
          - name: arm64
            runner: ubuntu-24.04-arm
            arch: linux/arm64
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push arch-specific image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform.arch }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ matrix.platform.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create & push manifest list :latest
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}:amd64 \
            ghcr.io/${{ github.repository }}:arm64

  cleanup:
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - name: Clean old amd64 versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 5
          ignore-versions: '^(latest|amd64|arm64)$'

      - name: Clean old arm64 versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 5
          ignore-versions: '^(latest|amd64|arm64)$'

      - name: Delete untagged orphan images
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          delete-only-untagged-versions: true
